<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SentinelAI — Investigation Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#12161C;
    --paper:#1B2029;
    --paper-raised:#232936;
    --line:#2C3340;
    --bone:#E9E6DD;
    --muted:#8B93A1;
    --amber:#E3A548;
    --amber-dim:#4a3f28;
    --red:#C1443C;
    --red-dim:#3a2422;
    --teal:#4FA398;
    --teal-dim:#1f3937;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:var(--ink);
    color:var(--bone);
    font-family:'IBM Plex Sans',sans-serif;
    min-height:100vh;
    background-image:
      radial-gradient(circle at 15% 10%, rgba(227,165,72,0.04), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(79,163,152,0.04), transparent 40%);
  }
  .wrap{max-width:920px;margin:0 auto;padding:40px 24px 100px;}

  /* ---- Header ---- */
  header{
    display:flex;justify-content:space-between;align-items:flex-end;
    border-bottom:1px solid var(--line);
    padding-bottom:20px;margin-bottom:36px;
  }
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-mark{
    width:34px;height:34px;border:2px solid var(--amber);
    display:flex;align-items:center;justify-content:center;
    font-family:'IBM Plex Mono';font-weight:600;color:var(--amber);font-size:15px;
    transform:rotate(45deg);
  }
  .brand-mark span{transform:rotate(-45deg);}
  .brand-text h1{
    font-family:'Space Grotesk';font-size:20px;font-weight:700;letter-spacing:0.5px;
  }
  .brand-text p{font-size:11px;color:var(--muted);font-family:'IBM Plex Mono';letter-spacing:1px;margin-top:2px;}
  .case-tag{
    font-family:'IBM Plex Mono';font-size:12px;color:var(--muted);text-align:right;
  }
  .case-tag b{color:var(--amber);display:block;font-size:13px;letter-spacing:0.5px;}

  /* ---- Intake panel ---- */
  .panel{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:2px;
    position:relative;
  }
  .panel::before{
    content:'';position:absolute;top:0;left:0;right:0;height:3px;
    background:linear-gradient(90deg,var(--amber),transparent 60%);
  }
  .panel-inner{padding:28px;}
  .panel-label{
    font-family:'IBM Plex Mono';font-size:11px;color:var(--amber);
    letter-spacing:1.5px;text-transform:uppercase;margin-bottom:16px;
  }

  .tabs{display:flex;gap:2px;margin-bottom:20px;background:var(--ink);padding:3px;border-radius:2px;width:fit-content;}
  .tab-btn{
    font-family:'IBM Plex Mono';font-size:12px;padding:8px 16px;
    background:transparent;border:none;color:var(--muted);cursor:pointer;
    letter-spacing:0.5px;border-radius:1px;transition:all 0.15s;
  }
  .tab-btn.active{background:var(--paper-raised);color:var(--bone);}

  .tab-content{display:none;}
  .tab-content.active{display:block;}

  .dropzone{
    border:1.5px dashed var(--line);
    border-radius:2px;
    padding:36px 20px;
    text-align:center;
    cursor:pointer;
    transition:border-color 0.2s, background 0.2s;
    position:relative;
  }
  .dropzone:hover, .dropzone.drag{border-color:var(--amber);background:rgba(227,165,72,0.03);}
  .dropzone svg{margin-bottom:10px;opacity:0.6;}
  .dropzone p{font-size:13px;color:var(--muted);}
  .dropzone .fname{font-family:'IBM Plex Mono';color:var(--amber);font-size:12px;margin-top:8px;}
  .dropzone input{display:none;}

  label.field-label{
    display:block;font-family:'IBM Plex Mono';font-size:11px;color:var(--muted);
    letter-spacing:0.5px;margin-bottom:6px;margin-top:16px;
  }
  textarea, input[type=text]{
    width:100%;background:var(--ink);border:1px solid var(--line);
    color:var(--bone);padding:12px;font-family:'IBM Plex Sans';font-size:13.5px;
    border-radius:2px;resize:vertical;
  }
  textarea:focus, input[type=text]:focus{outline:none;border-color:var(--amber);}
  textarea{min-height:80px;}

  .submit-btn{
    margin-top:22px;width:100%;padding:14px;
    background:var(--amber);color:var(--ink);border:none;
    font-family:'Space Grotesk';font-weight:600;font-size:14px;
    letter-spacing:0.3px;cursor:pointer;border-radius:2px;
    transition:filter 0.15s;
  }
  .submit-btn:hover{filter:brightness(1.08);}
  .submit-btn:disabled{opacity:0.5;cursor:not-allowed;}

  /* ---- Loading ---- */
  .scanning{
    display:none;margin-top:20px;padding:16px;
    border:1px solid var(--line);border-radius:2px;
    font-family:'IBM Plex Mono';font-size:12px;color:var(--amber);
    position:relative;overflow:hidden;
  }
  .scanning.active{display:block;}
  .scan-bar{
    position:absolute;top:0;left:0;width:30%;height:2px;background:var(--amber);
    animation:scan 1.4s ease-in-out infinite;
  }
  @keyframes scan{0%{left:-30%;}100%{left:100%;}}

  /* ---- Results ---- */
  #results{margin-top:32px;display:none;}
  #results.active{display:block;animation:fadeUp 0.4s ease;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

  .verdict-block{
    display:flex;align-items:center;gap:24px;
    padding:24px 28px;background:var(--paper);border:1px solid var(--line);
    border-radius:2px;margin-bottom:20px;position:relative;
  }
  .stamp{
    font-family:'Space Grotesk';font-weight:700;font-size:15px;
    padding:10px 18px;border:3px solid;border-radius:4px;
    transform:rotate(-6deg);letter-spacing:1px;white-space:nowrap;
    animation:stampIn 0.35s cubic-bezier(.2,1.6,.4,1);
  }
  @keyframes stampIn{from{transform:rotate(-6deg) scale(1.8);opacity:0;}to{transform:rotate(-6deg) scale(1);opacity:1;}}
  .stamp.high{color:var(--red);border-color:var(--red);}
  .stamp.medium{color:var(--amber);border-color:var(--amber);}
  .stamp.low{color:var(--teal);border-color:var(--teal);}

  .verdict-meta{flex:1;}
  .verdict-meta .vlabel{font-family:'IBM Plex Mono';font-size:11px;color:var(--muted);letter-spacing:1px;margin-bottom:4px;}
  .verdict-meta .vscore{font-family:'IBM Plex Mono';font-size:13px;}
  .bar-row{display:flex;align-items:center;gap:10px;margin-top:6px;}
  .bar-track{flex:1;height:6px;background:var(--ink);border-radius:3px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:3px;}

  .section{margin-bottom:20px;}
  .section-head{
    font-family:'IBM Plex Mono';font-size:11px;color:var(--amber);
    letter-spacing:1.5px;text-transform:uppercase;
    display:flex;align-items:center;gap:10px;margin-bottom:12px;
  }
  .section-head::after{content:'';flex:1;height:1px;background:var(--line);}

  .signal-card{
    background:var(--paper);border:1px solid var(--line);border-left:3px solid var(--line);
    padding:14px 16px;border-radius:2px;margin-bottom:8px;
  }
  .signal-card.verdict-malicious{border-left-color:var(--red);}
  .signal-card.verdict-suspicious{border-left-color:var(--amber);}
  .signal-card.verdict-clean{border-left-color:var(--teal);}
  .signal-top{display:flex;justify-content:space-between;align-items:center;}
  .signal-source{font-family:'Space Grotesk';font-weight:600;font-size:13.5px;}
  .signal-conf{font-family:'IBM Plex Mono';font-size:12px;color:var(--muted);}
  .signal-reason{font-size:12.5px;color:var(--muted);margin-top:4px;}

  .reasoning-list{list-style:none;}
  .reasoning-list li{
    font-size:13px;color:var(--bone);padding:8px 0 8px 18px;position:relative;
    border-bottom:1px solid var(--line);
  }
  .reasoning-list li:last-child{border-bottom:none;}
  .reasoning-list li::before{content:'—';position:absolute;left:0;color:var(--muted);}

  .action-box{
    background:var(--paper-raised);border:1px solid var(--line);
    border-radius:2px;padding:16px 18px;font-size:13.5px;line-height:1.6;
  }

  .history-item{
    font-family:'IBM Plex Mono';font-size:11.5px;color:var(--muted);
    padding:6px 0;border-bottom:1px solid var(--line);
  }

  .report-btn{
    margin-top:24px;padding:12px 20px;background:transparent;
    border:1px solid var(--amber);color:var(--amber);
    font-family:'IBM Plex Mono';font-size:12px;letter-spacing:0.5px;
    cursor:pointer;border-radius:2px;
  }
  .report-btn:hover{background:rgba(227,165,72,0.08);}

  .error-box{
    background:var(--red-dim);border:1px solid var(--red);color:#f0b8b4;
    padding:14px 16px;border-radius:2px;font-size:13px;margin-top:20px;
  }

  footer{margin-top:60px;text-align:center;font-family:'IBM Plex Mono';font-size:11px;color:var(--muted);letter-spacing:0.5px;}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <div class="brand-mark"><span>S</span></div>
      <div class="brand-text">
        <h1>SentinelAI</h1>
        <p>AUTONOMOUS INVESTIGATION BUREAU</p>
      </div>
    </div>
    <div class="case-tag">
      OPEN CASE FILE
      <b id="caseId">SNTL-2026-0000</b>
    </div>
  </header>

  <div class="panel">
    <div class="panel-inner">
      <div class="panel-label">// Submit Evidence</div>

      <div class="tabs">
        <button class="tab-btn active" data-tab="upload">Upload Image</button>
        <button class="tab-btn" data-tab="manual">Manual Entry</button>
      </div>

      <div class="tab-content active" id="tab-upload">
        <div class="dropzone" id="dropzone">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#8B93A1" stroke-width="1.5"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>
          <p>Drop a screenshot, QR code, or evidence image here<br>or click to browse</p>
          <div class="fname" id="fname"></div>
          <input type="file" id="fileInput" accept="image/*">
        </div>
        <button class="submit-btn" id="submitUpload">Open Investigation</button>
      </div>

      <div class="tab-content" id="tab-manual">
        <label class="field-label">MESSAGE / TEXT EVIDENCE</label>
        <textarea id="manualText" placeholder="Paste the suspicious message, email body, or SMS text..."></textarea>
        <label class="field-label">URL (OPTIONAL)</label>
        <input type="text" id="manualUrl" placeholder="https://suspicious-link.example.com">
        <button class="submit-btn" id="submitManual">Open Investigation</button>
      </div>

      <div class="scanning" id="scanning">
        <div class="scan-bar"></div>
        <span id="scanText">Dispatching agents...</span>
      </div>
    </div>
  </div>

  <div id="results"></div>

  <footer>SENTINELAI · LOCAL INVESTIGATION ENGINE · ALL EVIDENCE PROCESSED ON DEVICE</footer>
</div>

<script>
const API = "http://127.0.0.1:8000";
let lastText = "", lastUrl = "";

document.getElementById('caseId').textContent = 'SNTL-2026-' + String(Math.floor(1000 + Math.random()*8999));

// Tabs
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-'+btn.dataset.tab).classList.add('active');
  });
});

// Dropzone
const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');
let selectedFile = null;

dropzone.addEventListener('click', ()=>fileInput.click());
fileInput.addEventListener('change', e=>{
  if(e.target.files[0]){ selectedFile = e.target.files[0]; document.getElementById('fname').textContent = "✓ " + selectedFile.name; }
});
['dragover','dragenter'].forEach(evt=>dropzone.addEventListener(evt, e=>{e.preventDefault(); dropzone.classList.add('drag');}));
['dragleave','drop'].forEach(evt=>dropzone.addEventListener(evt, e=>{e.preventDefault(); dropzone.classList.remove('drag');}));
dropzone.addEventListener('drop', e=>{
  if(e.dataTransfer.files[0]){ selectedFile = e.dataTransfer.files[0]; document.getElementById('fname').textContent = "✓ " + selectedFile.name; }
});

function setLoading(on, msg){
  document.getElementById('scanning').classList.toggle('active', on);
  if(msg) document.getElementById('scanText').textContent = msg;
  document.getElementById('submitUpload').disabled = on;
  document.getElementById('submitManual').disabled = on;
}

document.getElementById('submitUpload').addEventListener('click', async ()=>{
  if(!selectedFile){ alert('Pehle koi image select karo'); return; }
  setLoading(true, 'Running OCR + QR scan...');
  document.getElementById('results').classList.remove('active');
  try{
    const fd = new FormData();
    fd.append('file', selectedFile);
    const res = await fetch(API + '/investigate/upload', { method:'POST', body: fd });
    const data = await res.json();
    lastText = data.step_1_ocr_extracted_text || "";
    lastUrl = data.step_4_url_chosen_for_analysis || "";
    renderResult(data.step_5_final_investigation);
  }catch(err){ showError(err); } finally{ setLoading(false); }
});

document.getElementById('submitManual').addEventListener('click', async ()=>{
  const text = document.getElementById('manualText').value;
  const url = document.getElementById('manualUrl').value;
  if(!text.trim() && !url.trim()){ alert('Text ya URL me se kam se kam ek daalo'); return; }
  setLoading(true, 'Dispatching agents...');
  document.getElementById('results').classList.remove('active');
  try{
    lastText = text; lastUrl = url;
    const res = await fetch(API + '/investigate', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({text, url})
    });
    const data = await res.json();
    renderResult(data);
  }catch(err){ showError(err); } finally{ setLoading(false); }
});

function showError(err){
  const r = document.getElementById('results');
  r.innerHTML = `<div class="error-box">Connection failed — check that the SentinelAI backend is running on ${API} and CORS is enabled.<br><span style="opacity:0.7">${err}</span></div>`;
  r.classList.add('active');
}

function verdictClass(v){
  if(v.includes('HIGH')) return 'high';
  if(v.includes('MEDIUM')) return 'medium';
  return 'low';
}
function signalClass(v){
  if(v === 'MALICIOUS') return 'verdict-malicious';
  if(v === 'SUSPICIOUS') return 'verdict-suspicious';
  return 'verdict-clean';
}

function renderResult(data){
  if(!data || data.error){
    document.getElementById('results').innerHTML = `<div class="error-box">${data ? data.error : 'No result returned'}</div>`;
    document.getElementById('results').classList.add('active');
    return;
  }
  const vclass = verdictClass(data.final_verdict);
  const barColor = vclass==='high' ? 'var(--red)' : vclass==='medium' ? 'var(--amber)' : 'var(--teal)';

  let html = `
    <div class="verdict-block">
      <div class="stamp ${vclass}">${data.final_verdict.split('—')[0].trim()}</div>
      <div class="verdict-meta">
        <div class="vlabel">${data.final_verdict}</div>
        <div class="vscore">Malicious ${data.malicious_confidence_pct}% · Clean ${data.clean_confidence_pct}%</div>
        <div class="bar-row">
          <div class="bar-track"><div class="bar-fill" style="width:${data.malicious_confidence_pct}%;background:${barColor}"></div></div>
        </div>
      </div>
    </div>`;

  if(data.individual_signals && data.individual_signals.length){
    html += `<div class="section"><div class="section-head">Evidence Signals</div>`;
    data.individual_signals.forEach(s=>{
      html += `<div class="signal-card ${signalClass(s.verdict)}">
        <div class="signal-top">
          <span class="signal-source">${s.source}</span>
          <span class="signal-conf">${s.verdict} · ${s.confidence}%</span>
        </div>
        <div class="signal-reason">${s.weight_reason || ''}</div>
      </div>`;
    });
    html += `</div>`;
  }

  if(data.explanation && data.explanation.length){
    html += `<div class="section"><div class="section-head">AI Reasoning</div><ul class="reasoning-list">`;
    data.explanation.forEach(e=>{ html += `<li>${e}</li>`; });
    html += `</ul></div>`;
  }

  if(data.past_history && data.past_history.length){
    html += `<div class="section"><div class="section-head">Prior Sightings</div>`;
    data.past_history.forEach(h=>{
      html += `<div class="history-item">${h.checked_at} — ${h.verdict} (${h.confidence}%)</div>`;
    });
    html += `</div>`;
  }

  html += `<button class="report-btn" id="downloadReport">↓ Download Forensic Report (PDF)</button>`;

  const r = document.getElementById('results');
  r.innerHTML = html;
  r.classList.add('active');

  document.getElementById('downloadReport').addEventListener('click', async ()=>{
    const res = await fetch(API + '/investigate/report', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({text: lastText, url: lastUrl})
    });
    const blob = await res.blob();
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = 'SentinelAI_Report.pdf';
    link.click();
  });
}
</script>
</body>
</html>
